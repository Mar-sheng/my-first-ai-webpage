<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>妈妈，母亲节快乐</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #5f2c42;
      background:
        radial-gradient(circle at 20% 20%, #fff0f5 0 22%, transparent 23%),
        radial-gradient(circle at 80% 15%, #ffe7bf 0 18%, transparent 19%),
        linear-gradient(135deg, #fff8e8, #ffd6e7 52%, #dff6ff);
    }

    main {
      width: min(92vw, 620px);
      padding: 42px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 26px;
      box-shadow: 0 24px 80px rgba(143, 72, 101, 0.22);
      backdrop-filter: blur(12px);
    }

    .heart {
      font-size: 76px;
      line-height: 1;
      animation: beat 1.3s infinite;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(34px, 8vw, 58px);
      letter-spacing: 0;
    }

    p {
      margin: 10px auto;
      max-width: 26em;
      font-size: clamp(18px, 4.2vw, 24px);
      line-height: 1.75;
    }

    .code {
      display: inline-block;
      margin: 20px 0 24px;
      padding: 12px 16px;
      color: #7a3d29;
      background: #fff7d9;
      border: 1px solid #ffe08a;
      border-radius: 12px;
      font-family: Consolas, monospace;
      font-size: 16px;
    }

    button {
      border: 0;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 18px;
      color: white;
      background: #e85d8a;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(232, 93, 138, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      background: #d94c7b;
    }

    #message {
      min-height: 42px;
      font-weight: 700;
      color: #b33a68;
    }

    .flower {
      position: fixed;
      top: -40px;
      pointer-events: none;
      animation: fall linear forwards;
      font-size: 24px;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.13); }
      60% { transform: scale(0.96); }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="heart">❤</div>
    <h1>妈妈，母亲节快乐</h1>
    <p>今天做了一个小小的网页，只想认真告诉你：</p>
    <div class="code">妈妈，我爱你，不止今天，而是每一天。</div>
    <p>谢谢你把普通日子，悄悄变成了我人生里最温暖的回忆。</p>
    <button id="surprise">运行祝福</button>
    <p id="message"></p>
  </main>

  <script>
    const wishes = [
      "愿妈妈今天开心，明天开心，以后的每一天都开心。",
      "妈妈辛苦啦，今天什么都不用操心，只负责收下我的爱。",
      "希望你身体健健康康，心情轻轻松松，笑容一直都在。",
      "谢谢你一直爱我、包容我、支持我，我都记在心里。",
      "以后换我多照顾你，多陪你聊天，多让你放心。",
      "愿妈妈每天都有好胃口、好睡眠、好心情。",
      "你不是超人，却为我做了很多超厉害的事。",
      "妈妈，辛苦了。今天要把所有温柔和祝福都送给你。",
      "希望岁月慢一点，再慢一点，让我有更多时间陪你。",
      "祝妈妈越来越漂亮，越来越开心，永远被爱包围。"
    ];

    const flowers = ["🌸", "🌷", "💐", "🌼", "💕"];
    const button = document.querySelector("#surprise");
    const message = document.querySelector("#message");

    button.addEventListener("click", () => {
      message.textContent = wishes[Math.floor(Math.random() * wishes.length)];

      for (let i = 0; i < 24; i++) {
        const flower = document.createElement("span");
        flower.className = "flower";
        flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = 2.2 + Math.random() * 2.3 + "s";
        flower.style.fontSize = 20 + Math.random() * 22 + "px";
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 5000);
      }
    });
  </script>
</body>
</html>
